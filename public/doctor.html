<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Dashboard | RAHAT</title><style>:root{--g:#214c35;--bg:#f4f8f5;--line:#d9e7dc;--muted:#65776b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#20392b;font:15px/1.55 Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:26px 18px 48px}header,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px #173f2410}header{background:var(--g);color:white;border:0;padding:28px}h1{margin:0 0 5px;font-size:clamp(25px,4vw,34px)}h2{margin-top:0}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{display:inline-block;background:#e3f2e5;color:#285943;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.item{padding:18px 0;border-bottom:1px solid #e6eee7}.item:last-child{border-bottom:0}.item-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.token{font-size:25px;font-weight:800;color:var(--g)}button{cursor:pointer;background:var(--g);color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:700}input,select,textarea{width:100%;padding:10px;border:1px solid #cad9cd;border-radius:8px;margin:5px 0 10px;font:inherit}label{display:block;font-size:13px;font-weight:700}a{color:#285943}.medicine-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:720px){.item-grid,.medicine-row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><header><div class="row"><div><h1>🩺 Doctor Dashboard</h1><p style="margin:0">Review tokens, update consultation notes and share instructions to the patient dashboard.</p></div><span class="badge">DOCTOR WORKSPACE · DEMO DATA</span></div></header><section class="panel"><div class="row"><div><h2>Today's token queue</h2><p class="muted">Queue order and wait times are
