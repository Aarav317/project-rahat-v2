<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hospital Staff Dashboard | RAHAT</title><style>body{margin:0;background:#f3f7f3;color:#20392b;font:15px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px}header,.panel{background:white;border:1px solid #dce8de;border-radius:18px;padding:22px;margin-bottom:18px}header{background:#214c35;color:white}h1{margin:0 0 8px}p{line-height:1.6}.muted{color:#718176;font-size:13px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.item{padding:14px 0;border-bottom:1px solid #e6eee7}.badge{background:#e3f2e5;color:#285943;padding:6px 10px;border-radius:20px;font-size:12px}button{cursor:pointer;background:#285943;color:white;border:0;border-radius:9px;padding:11px 15px}input,select{padding:11px;border:1px solid #cad9cd;border-radius:8px;margin:5px 6px 5px 0}form{display:flex;flex-wrap:wrap;gap:8px}a{color:#285943}</style></head><body><main class="wrap"><header><div class="row"><div><h1>🏥 Hospital Staff Dashboard</h1><p>RAHAT · demonstration queue</p></div><span class="badge">STAFF ROLE</span></div><p>Add and update fictional queue entries. This is not connected to a real hospital or patient system.</p></header><section class="panel"><h2>Add demo queue entry</h2><form id="addForm"><input id="name" maxlength="80" placeholder="Fictional label (e.g. Demo Patient 01)" required><input id="department" maxlength="80" placeholder="Department" required><button>Add to queue</button></form><p id="message" class="muted" role="status"></p></section><section class="panel"><div class="row"><h2>Queue</h2><button id="refresh">Refresh</button></div><div id="queue">Loading…</div></section><p><a href="/">← Back to RAHAT homepage</a></p></main><script src="/hospital-dashboard.js" defer></script></body></html>
